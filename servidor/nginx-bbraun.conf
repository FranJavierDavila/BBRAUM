# ---------------------------------------------------------------------------
# Nginx — proxy inverso para B. Braun · Evaluación de Inspección Visual
# Copiar a /etc/nginx/sites-available/bbraun (Debian/Ubuntu) o
# /etc/nginx/conf.d/bbraun.conf (RHEL/Rocky) y enlazar desde sites-enabled.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name evaluacion.bbraun.local;        # <-- tu dominio o IP

    # Subida de modelos 3D .glb (hasta 32 MB) y material de apoyo (hasta 8 MB)
    client_max_body_size 40M;

    # Compresión de texto; los .glb ya vienen comprimidos con Draco
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WASM del decodificador Draco con el tipo correcto
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Caché agresiva para los recursos con hash de Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS: ejecuta «certbot --nginx -d evaluacion.tuempresa.es» y certbot
# añadirá solo el bloque 443 con los certificados y el redireccionamiento.
